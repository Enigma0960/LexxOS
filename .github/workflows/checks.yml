name: Portable checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: minimal
          - flavor: full
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install guest application toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
      - name: Configure host
        run: >-
          cmake --preset ${{ matrix.flavor }}-host_native -B build/ci-host
          -DBUILD_TESTING=ON
          -DLEXXOS_ENABLE_STATIC_CHECKS=ON
      - name: Build host and contract tests
        run: cmake --build build/ci-host --parallel 2
      - name: Run contract and static checks
        run: ctest --test-dir build/ci-host --output-on-failure

  simulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: emulator
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install offscreen Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libportaudio2 gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
      - name: Install emulator and GUI test dependencies
        run: |
          python -m pip install uv
          uv sync --project emulator --locked
          echo "$GITHUB_WORKSPACE/emulator/.venv/bin" >> "$GITHUB_PATH"
      - name: Build full simulator through GUI entry point
        run: python emulator/lexxos_emu/gui.py --profile full --build-only
      - name: Run simulator regression
        run: |
          test -f build/full-dev-sim/src/liblexxos_sim.so
          python -m pytest emulator/tests --lexxos-sim-lib build/full-dev-sim/src/liblexxos_sim.so -q
