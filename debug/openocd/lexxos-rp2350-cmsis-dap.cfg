# LexxOS / RP2350 / CMSIS-DAP single-file OpenOCD configuration for CLion.
# Use this file later for Pico 2 / Pico 2 W boards if the selected OpenOCD
# revision contains target/rp2350.cfg.

source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 1000

source [find target/rp2350.cfg]
