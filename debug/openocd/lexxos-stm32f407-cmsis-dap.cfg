# LexxOS / STM32F407ZG / CMSIS-DAP single-file OpenOCD configuration for CLion.
#
# Intended hardware:
# - Raspberry Pi Debug Probe or another CMSIS-DAP compatible probe
# - SWD transport
# - STM32F407ZGT6 / Euse M4 DEMO Large board
#
# Minimal wiring:
#   Probe GND  -> board GND
#   Probe SWDIO/SD -> PA13 / SWDIO
#   Probe SWCLK/SC -> PA14 / SWCLK
#   Probe VTref/3V3 reference -> board 3.3V reference
#
# Optional but recommended:
#   Probe RESET -> board NRST

source [find interface/cmsis-dap.cfg]
transport select swd

# Conservative speed for first bring-up. After stable connection this can usually
# be raised to 2000..4000 kHz.
adapter speed 100

# STM32F407ZG has much more RAM than the smallest STM32F4 parts, but 32 KiB is a
# safe OpenOCD flash-programming work area and matches the upstream default.
set WORKAREASIZE 0x8000

source [find target/stm32f4x.cfg]

# If NRST is wired and the target is hard to attach to, these lines can be useful.
# Keep them commented by default because they can break reset on a SWD-only setup
# without a connected reset line.
# reset_config srst_only srst_nogate
# cortex_m reset_config sysresetreq
