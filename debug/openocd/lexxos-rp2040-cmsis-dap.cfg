# LexxOS / RP2040 / CMSIS-DAP single-file OpenOCD configuration for CLion.
# CLion OpenOCD Download & Run accepts one board configuration file, so this
# file includes both the debug probe interface and the target configuration.

source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 1000

source [find target/rp2040.cfg]
