# RK3506G2 / Cortex-A7 CPU0, Raspberry Pi Debug Probe (CMSIS-DAP).
# PREREQUISITES: board has booted via U-Boot and LexxOS has selected SWD
# on GPIO0_C6/C7 (RM_IO22/23). There is no debug-probe reset wiring.
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 1000
reset_config none

set _CHIPNAME rk3506
swd newdap $_CHIPNAME cpu -irlen 4
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.a7 cortex_a -dap $_CHIPNAME.dap -coreid 0
